name: 🎵 Music to Easy CI/CD

# PR a main: solo valida (lint, tests y build). No versiona ni publica.
# Push/merge a main: versiona, publica en GHCR, crea el Release y escanea.
# Este repo no automatiza deploy a ningun servidor.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: music-to-easy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Validacion: corre en PR y en push a main.
  # ---------------------------------------------------------------------------
  test:
    name: 🧪 Validacion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Node 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "npm"

      - name: 📦 Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: 🔍 Lint
        run: npm run lint

      - name: 🧪 Tests
        run: npm run test

      - name: 🏗️ Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # 2. Versionado: solo push a main, nunca en PR.
  # ---------------------------------------------------------------------------
  release:
    name: 🏷️ Version & Tag
    needs: test
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: 📥 Checkout con historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Node 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "npm"

      - name: 📦 Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: 🔧 Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🏷️ Versionar, taggear y pushear
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          git rebase origin/main
          if git describe --tags --exact-match HEAD > /dev/null 2>&1; then
            echo "HEAD ya versionado; se omite el bump."
          else
            npm run release
            git push --follow-tags origin main
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 3. Imagen: solo push a main, usando el commit versionado.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: 🐳 Build & Push GHCR
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout del commit versionado
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: 🧰 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🐳 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Metadata de imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.release.outputs.version }}
            type=raw,value=sha-${{ needs.release.outputs.sha }}
          labels: |
            org.opencontainers.image.title=Music to Easy
            org.opencontainers.image.description=Discord bot that makes music commands easy with buttons
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release.outputs.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}

      - name: 🏗️ Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false

      - name: 📋 Resumen de imagen
        run: |
          echo "Tags publicados:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

  # ---------------------------------------------------------------------------
  # 4. GitHub Release: solo push a main.
  # ---------------------------------------------------------------------------
  github-release:
    name: 📦 GitHub Release
    needs: [release, build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 📦 Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          name: Music to Easy v${{ needs.release.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false

  # ---------------------------------------------------------------------------
  # 5. Escaneo de seguridad: solo push a main.
  # ---------------------------------------------------------------------------
  security-scan:
    name: 🔒 Security Scan
    needs: [release, build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: 🔑 Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.release.outputs.version }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: 📊 Subir SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: "trivy-results.sarif"

      - name: 📋 Subir artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results-${{ github.run_number }}
          path: trivy-results.sarif
          retention-days: 30
          if-no-files-found: warn
